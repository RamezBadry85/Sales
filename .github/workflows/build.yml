name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK (release)
        id: apk
        run: |
          set +e
          flutter build apk --release > /tmp/apk.txt 2>&1
          code=$?
          echo "exit=$code" >> $GITHUB_OUTPUT
          python3 - <<'PY'
          text = open('/tmp/apk.txt').read()
          for i in range(0, max(len(text), 1), 5000):
              print(f"::error title=APK_{i // 5000}::{text[i:i + 5000]}")
          PY
      - uses: actions/upload-artifact@v4
        if: steps.apk.outputs.exit == '0'
        with:
          name: sales-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Result
        run: test "${{ steps.apk.outputs.exit }}" = "0"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        id: web
        run: |
          set +e
          flutter build web --release > /tmp/web.txt 2>&1
          code=$?
          echo "exit=$code" >> $GITHUB_OUTPUT
          python3 - <<'PY'
          text = open('/tmp/web.txt').read()
          for i in range(0, max(len(text), 1), 5000):
              print(f"::error title=WEB_{i // 5000}::{text[i:i + 5000]}")
          PY
      - uses: actions/upload-artifact@v4
        if: steps.web.outputs.exit == '0'
        with:
          name: sales-web
          path: build/web
          if-no-files-found: error
      - name: Result
        run: test "${{ steps.web.outputs.exit }}" = "0"

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows (release)
        id: win
        shell: pwsh
        run: |
          flutter build windows --release *> build.txt
          $code = $LASTEXITCODE
          "exit=$code" >> $env:GITHUB_OUTPUT
          $text = Get-Content build.txt -Raw
          for ($i = 0; $i -lt $text.Length; $i += 5000) {
            $len = [Math]::Min(5000, $text.Length - $i)
            $chunk = $text.Substring($i, $len).Replace("`n", " \n ")
            Write-Output "::error title=WINDOWS_$($i / 5000)::$chunk"
          }
      - uses: actions/upload-artifact@v4
        if: steps.win.outputs.exit == '0'
        with:
          name: sales-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
      - name: Result
        shell: pwsh
        run: |
          if ("${{ steps.win.outputs.exit }}" -ne "0") { exit 1 }
