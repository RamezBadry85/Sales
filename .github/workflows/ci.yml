name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  # One-off job that generates the platform folders (android/web/linux) with
  # the same `flutter create` template the SDK ships. It runs only for commits
  # whose message contains [scaffold] and pushes the result back to the branch.
  scaffold:
    if: contains(github.event.head_commit.message, '[scaffold]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,web,linux,windows,macos --org com.ramezbadry --project-name sales /tmp/scaffold
          cp -r /tmp/scaffold/android .
          cp -r /tmp/scaffold/web .
          cp -r /tmp/scaffold/linux .
          cp -r /tmp/scaffold/windows .
          cp /tmp/scaffold/.metadata .
          rm -rf android/app/src/test android/app/src/androidTest
          ls android
      - name: Commit scaffolding
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -A
          git commit -m "chore: generate android, web, linux and windows platform folders" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        id: analyze
        run: |
          set +e
          flutter analyze > /tmp/analyze.txt 2>&1
          code=$?
          echo "exit=$code" >> $GITHUB_OUTPUT
          # Surface the full report through workflow annotations, because the
          # annotation API is the only log channel available to the automation
          # that reads this project's CI results.
          python3 - <<'PY'
          text = open('/tmp/analyze.txt').read()
          for i in range(0, max(len(text), 1), 5500):
              chunk = text[i:i + 5500].replace('\n', ' \\n ')
              print(f"::error title=ANALYZE_{i // 5500}::{chunk}")
          PY

      - name: Test
        id: test
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test.txt 2>&1
          code=$?
          echo "exit=$code" >> $GITHUB_OUTPUT
          python3 - <<'PY'
          text = open('/tmp/test.txt').read()
          for i in range(0, max(len(text), 1), 5500):
              chunk = text[i:i + 5500].replace('\n', ' \\n ')
              print(f"::error title=TEST_{i // 5500}::{chunk}")
          PY

      - name: Result
        run: |
          echo "flutter analyze exit: ${{ steps.analyze.outputs.exit }}"
          echo "flutter test exit: ${{ steps.test.outputs.exit }}"
          test "${{ steps.analyze.outputs.exit }}" = "0"
          test "${{ steps.test.outputs.exit }}" = "0"
