name: CI
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versions
        run: |
          V=$(flutter --version | head -1)
          echo "::error title=FLUTTER_VERSION=$V::probe"
          D=$(dart --version 2>&1)
          echo "::error title=DART=$D::probe"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME 2>/dev/null | head -5
