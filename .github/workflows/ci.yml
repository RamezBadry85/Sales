name: CI
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: dart --version
      - run: java -version 2>&1
      - run: echo "ANDROID_HOME=$ANDROID_HOME"
