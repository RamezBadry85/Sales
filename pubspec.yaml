name: sales
description: Sales management application that replaces the Excel based sales workflow.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Exact decimal arithmetic for prices, discounts and totals.
  decimal: ^3.0.0
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Local SQLite persistence (Android/iOS + desktop via FFI + web via FFI web).
  sqflite: ^2.3.3
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
